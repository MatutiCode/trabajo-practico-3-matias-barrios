<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los simpson</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Los Simpson</h1>
    </header>
    <!-- Modal -->

    <div
      class="modal fade"
      id="detalleModal"
      tabindex="-1"
      aria-labelledby="detalleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="nombreModal"></h1>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <img id="imagenModal" class="img-fluid mb-3" width="200" />

            <p><strong>Edad:</strong> <span id="edadModal"></span></p>

            <p>
              <strong>Fecha de nacimiento:</strong>

              <span id="fechaModal"></span>
            </p>

            <p><strong>Género:</strong> <span id="generoModal"></span></p>

            <p><strong>Ocupación:</strong> <span id="ocupacionModal"></span></p>

            <p><strong>Estado:</strong> <span id="estadoModal"></span></p>

            <p><strong>Frase:</strong> <span id="fraseModal"></span></p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/js/app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
